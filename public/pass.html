<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Punch Card · Little Haven Play Studio</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#7a6253">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--brown:#5a463a;--brown2:#7a6253;--sage:#7ba06c;--sage-d:#5f7d52;--rose:#c97d76;--mint:#bfe3ce;--cream:#fbf5ec;--paper:#fff;--line:#ece4d6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);font-family:'Poppins',system-ui,sans-serif;color:var(--brown);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
  .top{display:flex;align-items:center;gap:8px;margin:6px 0 18px;color:var(--brown2);font-weight:700;font-size:.95rem;text-decoration:none}
  .top img{height:30px}
  .card{width:100%;max-width:380px;border-radius:26px;overflow:hidden;box-shadow:0 18px 40px rgba(90,70,58,.18);background:linear-gradient(160deg,#fdfaf4,#f3efe4)}
  .card .band{background:linear-gradient(135deg,var(--sage),#9ec089);padding:20px 22px 16px;color:#fff;position:relative}
  .card .band .logo{height:40px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.12))}
  .card .band .kicker{position:absolute;top:18px;right:20px;font-size:.62rem;font-weight:800;letter-spacing:.16em;background:rgba(255,255,255,.22);padding:5px 10px;border-radius:999px}
  .card .band h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.55rem;margin:10px 0 0;line-height:1.1}
  .card .band .who{font-size:.86rem;font-weight:600;opacity:.95;margin-top:2px}
  .body{padding:20px 22px 24px}
  .typebadge{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.04em;padding:5px 12px;border-radius:999px;background:#efe7dd;color:var(--brown2)}
  .typebadge.infant{background:#fbe7e4;color:var(--rose)}
  .count{display:flex;align-items:baseline;gap:8px;margin:16px 0 4px}
  .count b{font-size:3rem;font-weight:800;line-height:1;color:var(--sage-d)}
  .count span{font-weight:700;color:var(--brown2)}
  .dots{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 6px}
  .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem}
  .dot.left{background:var(--sage);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
  .dot.used{background:#fff;border:2px dashed #d8cdbb;color:#cbbfa9}
  .perk{display:flex;align-items:center;gap:8px;background:#efe7dd;color:var(--brown);font-weight:700;border-radius:12px;padding:10px 14px;margin:16px 0 0;font-size:.9rem}
  .meta{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--brown2)}
  .meta .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;color:var(--brown);font-size:.92rem;letter-spacing:.04em}
  .pill{display:inline-block;font-size:.72rem;font-weight:800;padding:5px 12px;border-radius:999px;margin-top:6px}
  .pill.warn{background:#fbe7e4;color:var(--rose)}
  .pill.ok{background:#e7f0df;color:var(--sage-d)}
  .cta{display:block;text-align:center;background:var(--sage);color:#fff;text-decoration:none;font-weight:800;padding:14px;border-radius:14px;margin-top:18px}
  .cta.alt{background:var(--rose)}
  .hint{max-width:380px;text-align:center;color:var(--brown2);font-size:.82rem;margin-top:16px;line-height:1.5}
  .state{max-width:380px;text-align:center;padding:30px 16px;color:var(--brown2)}
  .book{display:block;text-align:center;color:var(--sage-d);font-weight:700;text-decoration:none;margin-top:14px;font-size:.9rem}
</style>
</head>
<body>
  <a class="top" href="/index.html"><img src="/assets/inline-home-01.png" alt="">Little Haven Play Studio</a>

  <div id="root"><div class="state">Loading your card…</div></div>

  <p class="hint" id="hint" style="display:none">📸 Screenshot this card or bookmark this page — show it at the front desk, or just give us your code.</p>

<script>
  function $(s){return document.querySelector(s);}
  function fmtDate(iso){ if(!iso) return ""; var p=iso.split("-"); var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return m[(+p[1])-1]+" "+(+p[2])+", "+p[0]; }
  function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  var code=(new URLSearchParams(location.search).get("code")||"").trim().toUpperCase();
  var root=$("#root");
  if(!code){ root.innerHTML='<div class="state">No card code in the link.<br>Use the link from your purchase email, or look up your code on the booking page.<a class="book" href="/book.html">Go to booking →</a></div>'; }
  else {
    fetch("/api/pass-balance?card=1&code="+encodeURIComponent(code))
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.ok){ root.innerHTML='<div class="state">'+esc(d.error||"We couldn\'t find that card.")+'<a class="book" href="/book.html">Go to booking →</a></div>'; return; }
      var infant=d.admission==="infant";
      var total=d.visits||d.visitsRemaining||0;
      var left=d.visitsRemaining||0;
      var used=Math.max(0,total-left);
      var dots="";
      for(var i=0;i<total;i++){ dots += (i<left)?'<div class="dot left">♥</div>':'<div class="dot used"></div>'; }
      var statePill="";
      if(d.expired) statePill='<span class="pill warn">Expired '+fmtDate(d.expiry)+'</span>';
      else if(left<1) statePill='<span class="pill warn">No visits left — time to refill</span>';
      else statePill='<span class="pill ok">Active</span>';

      var html=''
       +'<div class="card">'
       +'  <div class="band">'
       +'    <span class="kicker">PUNCH CARD</span>'
       +'    <img class="logo" src="/assets/inline-home-01.png" alt="Little Haven">'
       +'    <h1>'+(infant?"Baby / Infant":"Regular")+' Punch Card</h1>'
       +(d.childName?'    <div class="who">for '+esc(d.childName)+'</div>':'')
       +'  </div>'
       +'  <div class="body">'
       +'    <span class="typebadge'+(infant?' infant':'')+'">'+(infant?"Baby / Infant admission":"Regular admission")+'</span>'
       +'    <div class="count"><b>'+left+'</b><span>of '+total+' visits left</span></div>'
       +'    <div class="dots">'+dots+'</div>'
       +'    <div class="perk">☕ Free coffee for the grown-up, every visit</div>'
       +'    <div class="meta"><div>Code<br><span class="code">'+esc(d.code||code)+'</span></div><div style="text-align:right">Expires<br><b>'+(d.expiry?fmtDate(d.expiry):"—")+'</b></div></div>'
       +'    <div style="margin-top:10px">'+statePill+'</div>'
       +(left<1 || d.expired
          ? '    <a class="cta alt" href="/passes.html">Reload my punch card →</a>'
          : '    <a class="cta" href="/book.html">Book a visit →</a>')
       +'  </div>'
       +'</div>';
      root.innerHTML=html;
      $("#hint").style.display="";
    })
    .catch(function(){ root.innerHTML='<div class="state">Something went wrong loading your card. Please try again.<a class="book" href="/book.html">Go to booking →</a></div>'; });
  }

  if("serviceWorker" in navigator){ navigator.serviceWorker.register("/sw.js").catch(function(){}); }
</script>
</body>
</html>
